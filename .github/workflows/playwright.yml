name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Create environment files (.env)
        run: |
          mkdir -p frontend
          mkdir -p backend
          mkdir -p env

          # 1. Записываем конфиг фронтенда
          echo 'VITE_BACKEND_URL="http://localhost:${{ secrets.APP_PORT }}/"' > ./frontend/.env

          # 2. Записываем конфиг бэкенда
          echo "PORT=${{ secrets.APP_PORT }}" > ./backend/.env
          echo 'DATABASE_URL="${{ secrets.DATABASE_URL }}"' >> ./backend/.env
          echo 'DB_URI="${{ secrets.DB_URI }}"' >> ./backend/.env
          echo "JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}" >> ./backend/.env
          echo "JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}" >> ./backend/.env

          # 3. ДУБЛИРУЕМ ИХ В ПАПКУ env (чтобы docker compose up гарантированно подхватил их на CI)
          cp ./frontend/.env ./env/.env.frontend 2>/dev/null || cp ./frontend/.env ./env/.env
          cp ./backend/.env ./env/.env.backend 2>/dev/null || true

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: Install wait-on utility globally
        run: npm install -g wait-on

      - name: Start Full Application Stack
        working-directory: ./env
        run: docker compose up -d --build

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Browsers & Deps (Cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Install Playwright System Deps Only (Cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: ./frontend
        run: npx playwright install-deps

      - name: Wait for Frontend and Backend services to be active
        run: wait-on http://localhost:5173 http://localhost:${{ secrets.APP_PORT }} --timeout 120000

      - name: Run Playwright tests
        working-directory: ./frontend
        run: npx playwright test --project=chromium --workers=1
        env:
          BASE_URL: http://localhost:5173

      - name: Stop Infrastructure
        if: always()
        working-directory: ./env
        run: docker compose down -v

      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
