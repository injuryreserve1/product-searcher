name: Security Dependency Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  npm-audit:
    name: Run NPM Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Audit Backend Prod Dependencies
        run: npm audit --only=prod --audit-level=high
        working-directory: ./backend

      - name: Audit Front Prod Dependencies
        if: always()
        run: npm audit --only=prod --audit-level=high
        working-directory: ./frontend

      - name: Audit Dev Dependencies (Log only)
        if: always()
        run: |
          echo "=== Backend Dev Audit ==="
          cd backend && npm audit --only=dev || true
          echo "=== Frontend Dev Audit ==="
          cd ../frontend && npm audit --only=dev || true
